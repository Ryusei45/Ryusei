<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lovely CN Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    padding:18px 10px;
    color:#fff;

    background:
        radial-gradient(
            circle at 15% 5%,
            rgba(0,120,255,.18),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(0,70,255,.15),
            transparent 25%
        ),
        #030811;

    overflow-x:hidden;
}

/* GLOW BACKGROUND */

body::before{
    content:"";
    position:fixed;

    width:250px;
    height:250px;

    background:#008cff;

    filter:blur(160px);

    opacity:.12;

    top:-100px;
    left:-100px;

    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;

    width:250px;
    height:250px;

    background:#004cff;

    filter:blur(160px);

    opacity:.12;

    bottom:-100px;
    right:-100px;

    pointer-events:none;
}

.container{
    width:100%;
    max-width:1050px;
    margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
    text-align:center;
    margin-bottom:18px;
    position:relative;
}

.header h1{
    font-size:clamp(34px,9vw,70px);
    font-weight:900;

    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #008cff,
            #fff,
            #42a9ff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 15px rgba(0,140,255,.5),
        0 0 35px rgba(0,100,255,.2);
}

.header p{
    color:#cbd5e1;
    font-size:13px;
    margin-top:5px;
}

.header span{
    color:#008cff;
}

/* =========================
   DECORATION
========================= */

.decor{
    position:absolute;

    color:#008cff;

    font-size:20px;

    text-shadow:
        0 0 12px #008cff;

    opacity:.8;
}

.decor.one{
    left:2%;
    top:5px;
}

.decor.two{
    right:2%;
    top:10px;
}

/* =========================
   VISUALS
   SELALU 2 KOLOM
========================= */

.visuals{

    display:grid;

    /*
       INI YANG MEMBUAT
       JKT48 + ANIME TETAP
       BERDAMPINGAN DI HP
    */

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap:8px;

    margin-bottom:12px;
}

.card{

    min-width:0;

    background:
        rgba(5,14,27,.95);

    border:
        1px solid rgba(0,140,255,.45);

    border-radius:12px;

    padding:7px;

    box-shadow:
        0 0 18px rgba(0,110,255,.08);

    overflow:hidden;
}

.card-title{

    text-align:center;

    font-size:11px;

    font-weight:bold;

    color:#008cff;

    margin-bottom:7px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    text-shadow:
        0 0 8px rgba(0,140,255,.5);
}

.card-title.anime{
    color:#54aaff;
}

/* FOTO */

.image-box{

    width:100%;

    /*
       Rasio landscape supaya
       dua gambar tetap nyaman
       dilihat berdampingan.
    */

    aspect-ratio:4 / 3;

    border-radius:9px;

    overflow:hidden;

    background:#07101d;

    border:
        1px solid rgba(0,140,255,.2);
}

.image-box img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

}

/* LABEL FOTO */

.image-name{

    margin:6px auto 0;

    width:100%;

    padding:5px 3px;

    border:
        1px solid #008cff;

    border-radius:20px;

    color:#fff;

    text-align:center;

    font-size:9px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

    box-shadow:
        0 0 10px rgba(0,140,255,.15);
}

/* =========================
   GENERATOR
========================= */

.generator{

    background:
        rgba(5,14,27,.95);

    border:
        1px solid rgba(0,140,255,.35);

    border-radius:13px;

    padding:13px;

    margin-bottom:12px;
}

.input-title{

    color:#008cff;

    font-size:13px;

    font-weight:bold;

    margin-bottom:8px;

    text-shadow:
        0 0 8px rgba(0,140,255,.4);
}

.input-area{

    display:flex;

    gap:7px;

}

input{

    min-width:0;

    flex:1;

    background:#050b14;

    border:
        1px solid #25364c;

    outline:none;

    color:white;

    font-size:14px;

    padding:12px;

    border-radius:9px;

}

input::placeholder{
    color:#667487;
}

input:focus{

    border-color:#008cff;

    box-shadow:
        0 0 12px rgba(0,140,255,.2);
}

.generate{

    border:none;

    border-radius:9px;

    padding:
        0 14px;

    font-size:12px;

    font-weight:bold;

    color:#fff;

    background:
        linear-gradient(
            100deg,
            #006eff,
            #008cff
        );

    cursor:pointer;

    white-space:nowrap;

    box-shadow:
        0 0 15px rgba(0,110,255,.25);
}

/* =========================
   HASIL
========================= */

.result-box{

    background:
        rgba(5,14,27,.95);

    border:
        1px solid rgba(0,140,255,.35);

    border-radius:13px;

    padding:13px;

    margin-bottom:12px;
}

.result-title{

    font-size:15px;

    color:#008cff;

    margin-bottom:10px;

    font-weight:bold;
}

.cn-item{

    display:flex;

    align-items:center;

    gap:7px;

    background:#050b14;

    border:
        1px solid #1c3048;

    padding:8px;

    border-radius:9px;

    margin-bottom:7px;

}

.cn-item:last-child{
    margin-bottom:0;
}

.number{

    min-width:29px;
    height:29px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #006eff,
            #009dff
        );

    font-size:12px;

    font-weight:bold;

    box-shadow:
        0 0 10px rgba(0,140,255,.25);
}

.cn-text{

    flex:1;

    min-width:0;

    font-size:13px;

    word-break:break-word;
}

.copy{

    border:
        1px solid #008cff;

    background:transparent;

    color:#39a7ff;

    padding:7px 9px;

    border-radius:7px;

    cursor:pointer;

    font-size:10px;

    font-weight:bold;

    white-space:nowrap;
}

.copy:active{

    background:#008cff;

    color:#fff;
}

/* =========================
   TIPS
========================= */

.tips{

    background:
        linear-gradient(
            120deg,
            rgba(0,110,255,.08),
            rgba(0,190,255,.04)
        );

    border:
        1px solid rgba(0,140,255,.25);

    border-radius:13px;

    padding:13px;

    display:flex;

    align-items:center;

    gap:10px;
}

.tip-icon{

    min-width:38px;
    height:38px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:18px;

    border:
        1px solid #008cff;

    color:#008cff;
}

.tips h3{

    color:#008cff;

    font-size:13px;

    margin-bottom:3px;
}

.tips p{

    color:#aebccc;

    font-size:11px;

    line-height:1.4;
}

/* =========================
   TOAST
========================= */

.toast{

    position:fixed;

    left:50%;
    bottom:20px;

    transform:
        translateX(-50%)
        translateY(80px);

    background:#07111e;

    border:
        1px solid #008cff;

    color:white;

    padding:9px 17px;

    border-radius:30px;

    font-size:12px;

    box-shadow:
        0 0 20px rgba(0,140,255,.3);

    opacity:0;

    transition:.3s;

    z-index:100;
}

.toast.show{

    transform:
        translateX(-50%)
        translateY(0);

    opacity:1;
}

/* =========================
   FOOTER
========================= */

footer{

    text-align:center;

    color:#536274;

    margin-top:15px;

    font-size:10px;
}

/* =========================
   HP KECIL
========================= */

@media(max-width:380px){

    body{
        padding:14px 7px;
    }

    .visuals{
        gap:6px;
    }

    .card{
        padding:6px;
        border-radius:10px;
    }

    .card-title{
        font-size:9px;
    }

    .image-name{
        font-size:8px;
    }

    .input-area{
        gap:5px;
    }

    .generate{
        padding:0 9px;
        font-size:10px;
    }

    .cn-text{
        font-size:11px;
    }

    .copy{
        padding:6px 7px;
        font-size:9px;
    }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<header class="header">

    <div class="decor one">✦</div>
    <div class="decor two">✧</div>

    <h1>CN GENERATOR</h1>

    <p>
        Lovelyz Style
    </p>

</header>


<!-- FOTO -->

<section class="visuals">


    <!-- JKT48 -->

    <div class="card">

        <div class="card-title">
            👥 MEMBER JKT48
        </div>

        <div class="image-box">

            <img
                src="jkt48.jpg"
                alt="Member JKT48"
                onerror="
                this.src='https://placehold.co/600x450/07101d/008cff?text=JKT48';
                "
            >

        </div>

        <div class="image-name">
            ✦ JKT48 MEMBER ✦
        </div>

    </div>


    <!-- ANIME -->

    <div class="card">

        <div class="card-title anime">
            ♡ ANIME VIBES
        </div>

        <div class="image-box">

            <img
                src="anime.jpg"
                alt="Anime"
                onerror="
                this.src='https://placehold.co/600x450/07101d/55aaff?text=ANIME';
                "
            >

        </div>

        <div
            class="image-name"
            style="border-color:#168cff;"
        >
            ✦ Masha Kujou ✦
        </div>

    </div>


</section>


<!-- INPUT -->

<section class="generator">

    <div class="input-title">
        👤 MASUKKAN NAMA KAMU
    </div>

    <div class="input-area">

        <input
            type="text"
            id="nameInput"
            placeholder="Contoh:Ryusei"
            autocomplete="off"
            onkeydown="handleEnter(event)"
        >

        <button
            class="generate"
            onclick="generateCN()"
        >
            GENERATE ✦
        </button>

    </div>

</section>


<!-- HASIL -->

<section
    class="result-box"
    id="resultBox"
    style="display:none;"
>

    <div class="result-title">

        ☆ HASIL CN

        <span
            style="
            font-size:11px;
            color:#718096;
            "
        >
        </span>

    </div>


    <div class="cn-item">

        <div class="number">1</div>

        <div
            class="cn-text"
            id="cn1"
        ></div>

        <button
            class="copy"
            onclick="copyCN(1)"
        >
            ▣ COPY
        </button>

    </div>


    <div class="cn-item">

        <div class="number">2</div>

        <div
            class="cn-text"
            id="cn2"
        ></div>

        <button
            class="copy"
            onclick="copyCN(2)"
        >
            ▣ COPY
        </button>

    </div>


    <div class="cn-item">

        <div class="number">3</div>

        <div
            class="cn-text"
            id="cn3"
        ></div>

        <button
            class="copy"
            onclick="copyCN(3)"
        >
            ▣ COPY
        </button>

    </div>


    <div class="cn-item">

        <div class="number">4</div>

        <div
            class="cn-text"
            id="cn4"
        ></div>

        <button
            class="copy"
            onclick="copyCN(4)"
        >
            ▣ COPY
        </button>

    </div>


    <div class="cn-item">

        <div class="number">5</div>

        <div
            class="cn-text"
            id="cn5"
        ></div>

        <button
            class="copy"
            onclick="copyCN(5)"
        >
            ▣ COPY
        </button>

    </div>

</section>


<!-- TIPS -->

<section class="tips">

    <div class="tip-icon">
        ☆
    </div>

    <div>

        <h3>TIPS</h3>

        <p>
            Gunakan CN Khusus LVC supaya 
            profil TikTok kamu dikenali oleh member lain
            dan biar profil kamu makin keren! ✨
        </p>

    </div>

</section>


<footer>
    Lovelyz Family • LVC
</footer>


</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
>
    ✓ Asek CN !
</div>


<script>

/* =========================
   GENERATE
========================= */

function generateCN(){

    const input =
        document.getElementById(
            "nameInput"
        );

    const name =
        input.value.trim();


    if(name === ""){

        input.focus();

        showToast(
            "⚠ Masukkan nama dulu bre!"
        );

        return;
    }


    const cn = [

        name + " ft 𝐋𝐕𝐂",

        name + "`아름다운",

        name + "`素敵",

        "아름다운`" + name,

        "素敵`" + name

    ];


    for(
        let i = 0;
        i < 5;
        i++
    ){

        document.getElementById(
            "cn" + (i + 1)
        ).textContent = cn[i];

    }


    document.getElementById(
        "resultBox"
    ).style.display = "block";


    window.generatedCN = cn;


    setTimeout(() => {

        document.getElementById(
            "resultBox"
        ).scrollIntoView({

            behavior:"smooth",
            block:"start"

        });

    },100);

}


/* =========================
   COPY
========================= */

function copyCN(number){

    if(!window.generatedCN){
        return;
    }


    const text =
        window.generatedCN[
            number - 1
        ];


    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
        .writeText(text)
        .then(() => {

            showToast(
                "✓ CN berhasil disalin!"
            );

        });

    }else{

        const textarea =
            document.createElement(
                "textarea"
            );

        textarea.value = text;

        document.body.appendChild(
            textarea
        );

        textarea.select();

        document.execCommand(
            "copy"
        );

        textarea.remove();

        showToast(
            "✓ CN berhasil disalin!"
        );

    }

}


/* =========================
   ENTER
========================= */

function handleEnter(event){

    if(event.key === "Enter"){

        generateCN();

    }

}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    },1800);

}

</script>

</body>
</html>s
